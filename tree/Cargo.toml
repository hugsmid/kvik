[package]
name = "kvik-tree"
version = "0.1.0"
description = "Summary-tree nodes of the kvik time-series store: the per-node fold, merge and canonical byte layout"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
repository = "https://github.com/hugsmid/kvik"
readme = "README.md"
keywords = ["time-series", "storage", "embedded"]
categories = ["database-implementations"]

[dependencies]
# File header, block framing, CRC32C and positions shared with the other kvik files (`format.md` A.1, A.2).
kvik-log = { path = "../log" }
num-bigint = "0.4"
num-rational = { version = "0.4", default-features = false, features = ["std", "num-bigint"] }
num-traits = "0.2"
thiserror = "2"

[dev-dependencies]
# The reference model: the oracle the fold and merge are compared with.
kvik-model = { path = "../model" }
proptest = "1"

[lints]
workspace = true
