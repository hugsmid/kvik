[package]
name = "encodings"
version = "0.0.0"
description = "Spike: candidate chunk encodings measured against Parquet (roadmap 2.1); not part of the engine"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
arrow-array = "60.1"
arrow-schema = "60.1"
bytes = "1"
parquet = { version = "60.1", default-features = false, features = ["arrow", "zstd"] }
zstd = { version = "0.14", default-features = false }

[lints]
workspace = true

[dev-dependencies]
proptest = "1"
