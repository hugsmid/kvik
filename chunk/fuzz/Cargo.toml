[package]
name = "kvik-chunk-fuzz"
version = "0.0.0"
description = "Fuzz targets for kvik-chunk; built with nightly cargo-fuzz, outside the workspace"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
kvik-chunk = { path = ".." }

# Its own workspace, so the main workspace never builds it.
[workspace]

[[bin]]
name = "block"
path = "fuzz_targets/block.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compacted"
path = "fuzz_targets/compacted.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chunk_index"
path = "fuzz_targets/chunk_index.rs"
test = false
doc = false
bench = false

[[bin]]
name = "file_bodies"
path = "fuzz_targets/file_bodies.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compacted_resealed"
path = "fuzz_targets/compacted_resealed.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chunk_index_resealed"
path = "fuzz_targets/chunk_index_resealed.rs"
test = false
doc = false
bench = false
