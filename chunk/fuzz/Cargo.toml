[package]
name = "kvik-chunk-fuzz"
version = "0.0.0"
description = "Fuzz targets for kvik-chunk; built with nightly cargo-fuzz, outside the workspace"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
kvik-chunk = { path = ".." }

# Its own workspace, so the main workspace never builds it.
[workspace]

[[bin]]
name = "block"
path = "fuzz_targets/block.rs"
test = false
doc = false
bench = false
