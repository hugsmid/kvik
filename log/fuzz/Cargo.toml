[package]
name = "kvik-log-fuzz"
version = "0.0.0"
description = "Fuzz targets for kvik-log; built with nightly cargo-fuzz, outside the workspace"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
kvik-log = { path = ".." }

# Its own workspace, so the main workspace never builds it.
[workspace]

[[bin]]
name = "segment"
path = "fuzz_targets/segment.rs"
test = false
doc = false
bench = false
