[package]
name = "kvik-log"
version = "0.1.0"
description = "On-disk log format of the kvik time-series store: segment files, blocks, checksums and the durable mark"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository = "https://github.com/hugsmid/kvik"
readme = "README.md"
keywords = ["time-series", "storage", "embedded", "log"]
categories = ["database-implementations"]

[dependencies]
crc = "3.4"
# The plaintext SHA-256 of a sealed segment (`spec.md` §8 Hashes, `format.md` A.9).
sha2 = { version = "0.11", default-features = false }
thiserror = "2"

[target.'cfg(unix)'.dependencies]
# Free space through `statvfs` without unsafe code (`format.md` A.13).
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }

[features]
# A health reason no other crate maps, for testing how a caller reports a reason it does not know (Q-221 (d)).
unmapped-reason = []

[dev-dependencies]
# The reference model: the meaning of facts and entries, for the differential test.
kvik-model = { path = "../model" }
proptest = "1"

[lints]
workspace = true

[[example]]
name = "commit_latency"
test = true
