[workspace]
resolver = "3"
members = ["model", "kvik", "log", "chunk", "sinkapi", "sink", "backup", "export", "files", "spikes/encodings", "spikes/commit", "tree", "cli"]
# The fuzz targets build with nightly cargo-fuzz in their own workspaces (`log/fuzz/README.md`, `chunk/fuzz/README.md`,
# `files/fuzz/README.md`, `backup/fuzz/README.md`).
exclude = ["log/fuzz", "chunk/fuzz", "files/fuzz", "tree/fuzz", "backup/fuzz"]
# The spikes and the export crate are built and tested in their own CI jobs (`cargo test -p encodings`,
# `cargo test -p commit`, `cargo test -p kvik-export`).
default-members = ["model", "kvik", "log", "chunk", "sinkapi", "sink", "backup", "files", "tree", "cli"]

[workspace.package]
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
rust-version = "1.100"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# Set only for the model-checker tests of `kvik` (Q-901).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kvik_loom)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.test]
opt-level = 1

[profile.test.package.proptest]
opt-level = 3

[profile.test.package.num-bigint]
opt-level = 3
