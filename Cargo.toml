[workspace]
resolver = "3"
members = ["model", "spikes/encodings"]
# The spike is built and tested in its own CI job (`cargo test -p encodings`).
default-members = ["model"]

[workspace.package]
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
rust-version = "1.100"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.test]
opt-level = 1

[profile.test.package.proptest]
opt-level = 3

[profile.test.package.num-bigint]
opt-level = 3
