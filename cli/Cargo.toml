[package]
name = "kvik-cli"
version = "0.1.0"
description = "The read-only command-line tool for kvik stores"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository = "https://github.com/hugsmid/kvik"
readme = "README.md"

[lib]
name = "kvik_cli"

[[bin]]
name = "kvik"
path = "src/main.rs"
# The library crate `kvik` has the same name (the query design's section 6).
doc = false

[dependencies]
jiff = { version = "0.2", default-features = false, features = ["std"] }
kvik = { path = "../kvik" }
kvik-log = { path = "../log" }
# The tool lowers its own priority (the query design's section 6) where rustix has `setpriority`.
[target.'cfg(any(target_os = "linux", target_os = "android", target_os = "macos", target_os = "freebsd", target_os = "dragonfly", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["process", "std"] }

[dev-dependencies]
insta = "1"

[lints]
workspace = true
