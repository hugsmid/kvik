[package]
name = "kvik"
version = "0.1.0"
description = "Embedded time-series store for device and sensor data"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository = "https://github.com/hugsmid/kvik"
readme = "README.md"
keywords = ["time-series", "storage", "embedded"]
categories = ["database-implementations"]

[features]
default = ["bundled-tzdb"]
# Embeds the IANA time-zone database in the binary instead of reading the
# system's. The model backend embeds it in any case.
bundled-tzdb = ["jiff/tzdb-bundle-always"]
# Conversions between the interface's time types and jiff 0.2's.
jiff = []

[dependencies]
jiff = { version = "0.2", default-features = false, features = ["std"] }
kvik-log = { path = "../log" }
# The reference model: the in-memory backend (`Backend::Model`), and the
# definition rules both backends share.
kvik-model = { path = "../model" }
thiserror = "2"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
