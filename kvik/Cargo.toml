[package]
name = "kvik"
version = "0.1.0"
description = "Embedded time-series store for device and sensor data"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository = "https://github.com/hugsmid/kvik"
readme = "README.md"
keywords = ["time-series", "storage", "embedded"]
categories = ["database-implementations"]

[features]
default = ["bundled-tzdb"]
# Deprecated and empty, kept for one release: the model backend is always built and chosen with
# `Backend::Model`; the default backend is now the durable one.
model-backend = []
# Embeds the IANA time-zone database in the binary instead of reading the
# system's. The model backend embeds it in any case.
bundled-tzdb = ["jiff/tzdb-bundle-always"]
# Conversions between the interface's time types and jiff 0.2's.
jiff = []

[dependencies]
jiff = { version = "0.2", default-features = false, features = ["std"] }
kvik-log = { path = "../log" }
# The reference model: the in-memory backend (`Backend::Model`), and the
# definition rules both backends share.
kvik-model = { path = "../model" }
# The backup and restore drivers (roadmap 8.1d, 8.3d) and the manifest they record in.
kvik-backup = { path = "../backup" }
kvik-files = { path = "../files" }
# The backup sink trait and its types, re-exported unchanged.
kvik-sink-api = { path = "../sinkapi" }
# Summary nodes: the fold, merge and edge credit windows are evaluated with.
kvik-tree = { path = "../tree" }
thiserror = "2"
# The warning of a segment size above the default for a store that reads files from a bucket (Q-970).
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
kvik-log = { path = "../log", features = ["unmapped-reason"] }
proptest = "1"
# Counts the heap a reader holds in `tests/latest_memory.rs`, with no unsafe code of ours.
stats_alloc = "0.1.10"
# The peak a query allocates in `tests/query_memory.rs`, with no unsafe code of ours.
peak_alloc = "0.3.0"

# The model checker for the single-flight refresh, built only with `--cfg kvik_loom` (Q-901).
[target.'cfg(kvik_loom)'.dev-dependencies]
loom = "0.7.2"

# The budgets S1 to S3 and S13 on a year of seals (roadmap 9.0e): `cargo bench -p kvik --bench read`.
[[bench]]
name = "read"
harness = false

# Ingest latency through `emit` (Q-2184): `cargo bench -p kvik --bench emit`.
[[bench]]
name = "emit"
harness = false

[lints]
workspace = true
