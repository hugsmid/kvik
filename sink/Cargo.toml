[package]
name = "kvik-sink"
version = "0.1.0"
description = "Backup sink for the kvik time-series store over S3-compatible object storage, with an in-memory fake for tests"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository = "https://github.com/hugsmid/kvik"
readme = "README.md"
keywords = ["time-series", "backup", "object-storage"]
categories = ["database-implementations"]

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["std"] }
hmac = "0.13"
# The `BackupSink` trait and its types.
kvik = { path = "../kvik", default-features = false }
sha2 = "0.11"
thiserror = "2"
# A blocking HTTP/1.1 client over rustls, run on the sink's own worker threads
# so that the futures the sink returns never block when polled.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
